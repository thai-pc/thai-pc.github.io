name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_DEMO_URL: ${{ vars.PUBLIC_DEMO_URL }}
          PUBLIC_POLAR_PRO_YEARLY: ${{ vars.PUBLIC_POLAR_PRO_YEARLY }}
          PUBLIC_POLAR_PRO_MONTHLY: ${{ vars.PUBLIC_POLAR_PRO_MONTHLY }}
          PUBLIC_POLAR_STUDIO_YEARLY: ${{ vars.PUBLIC_POLAR_STUDIO_YEARLY }}
          PUBLIC_POLAR_STUDIO_MONTHLY: ${{ vars.PUBLIC_POLAR_STUDIO_MONTHLY }}
          PUBLIC_POLAR_SUPPORT_YEARLY: ${{ vars.PUBLIC_POLAR_SUPPORT_YEARLY }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v4